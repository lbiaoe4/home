<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>LBI • Painel</title>

  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../theme-aoe4.css">
  <link rel="stylesheet" href="./painel.css">
</head>

<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="../index.html">
      <img src="../assets/logo.png" alt="LBI" class="brand-logo"/>
      <span class="brand-name">LBI</span>
    </a>

    <div class="p-userbox" id="topUserBox">
      <!-- preenchido via JS -->
    </div>
  </div>
</header>

<section class="section bg-solid-1" style="min-height: calc(100vh - 68px);">
  <div class="p-wrap">
    <div class="p-shell">

      <!-- Sidebar USER -->
      <aside class="card" id="userSidebar" style="display:none;">
        <div class="card-h">
          <div>
            <div class="kicker">Menu</div>
            <h2 class="h1like" style="margin:0;">Usuário</h2>
          </div>
          <span class="notify-dot on" title="Notificações"></span>
        </div>
        <div class="side-nav">
          <div class="side-item active" data-view="meus-dados">
            <span>Meus Dados</span><span class="notify-dot warn"></span>
          </div>
          <div class="side-item" data-view="partidas">
            <span>Partidas Disponíveis</span><span class="notify-dot on"></span>
          </div>
          <div class="side-item" data-view="inscricoes">
            <span>Inscrições</span><span class="notify-dot on"></span>
          </div>
          <div class="side-item" data-view="resultados">
            <span>Resultados</span><span class="notify-dot"></span>
          </div>
        </div>
      </aside>

      <!-- Sidebar ADMIN -->
      <aside class="card" id="adminSidebar" style="display:none;">
        <div class="card-h">
          <div>
            <div class="kicker">Menu</div>
            <h2 class="h1like" style="margin:0;">Admin</h2>
          </div>
          <span class="notify-dot on" title="Notificações"></span>
        </div>
        <div class="card-b">
          <div class="icon-grid">
            <div class="icon-tile" data-admin="usuarios">
              <div>
                <div class="icon-title">Gerenciar Usuários</div>
                <div class="muted small">editar, excluir, access level</div>
              </div>
              <span class="notify-dot on"></span>
            </div>

            <div class="icon-tile" data-admin="eventos">
              <div>
                <div class="icon-title">Gerenciar Eventos</div>
                <div class="muted small">status e cadastro</div>
              </div>
              <span class="notify-dot warn"></span>
            </div>

            <div class="icon-tile" data-admin="inscricoes">
              <div>
                <div class="icon-title">Gerenciar Inscrições</div>
                <div class="muted small">aprovar, editar, excluir</div>
              </div>
              <span class="notify-dot on"></span>
            </div>

            <div class="icon-tile" data-admin="resultados">
              <div>
                <div class="icon-title">Gerenciar Resultados</div>
                <div class="muted small">lançamento e validação</div>
              </div>
              <span class="notify-dot"></span>
            </div>
          </div>
        </div>
      </aside>

      <!-- Conteúdo -->
      <main class="card">
        <div class="card-h">
          <div>
            <div class="kicker" id="viewKicker">Painel</div>
            <h2 class="h1like" id="viewTitle">Meus Dados</h2>
          </div>
          <span class="p-pill" id="viewBadge">User</span>
        </div>

        <div class="card-b" id="viewRoot">
          <!-- views renderizadas via JS -->
        </div>
      </main>

    </div>
  </div>
</section>

<script src="./app.js"></script>
<script src="./app.draft_open_by_phase_patch.js"></script>
<script src="./draft-phase-patch.js"></script>
<script>
  window.LBI_APP.bootAppPage();
</script>

</body>
</html>
